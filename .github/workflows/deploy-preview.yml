name: Deploy web preview

# Builds the Expo web bundle and publishes it to GitHub Pages on every push,
# so there's always a live, up-to-date URL to test Harf in a phone browser —
# no download required. URL: https://<owner>.github.io/Urdu/

on:
  push:
    branches:
      - claude/language-learning-android-app-yu2gzz
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel in-flight builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These run before the build so a broken push fails loudly rather than
      # deploying. They are cheap — seconds — and cover the things a
      # typechecker cannot: content wiring, and how forgiving typed answers are.
      - name: Typecheck
        run: npm run typecheck

      - name: Audit content
        run: npm run audit

      - name: Check the typed-answer matcher
        run: npm run check:roman

      - name: Check that tracing is passable
        run: npm run check:trace

      - name: Check that every generated question is answerable
        run: npm run check:answerable

      - name: Check that spaced repetition does what it claims
        run: npm run check:srs

      # The palette promises that re-theming is one file. Two things break that
      # silently and neither shows on screen: tailwind.config.js drifting from
      # colors.ts (it has, across two re-themes), and colour written as raw hex
      # inside a component.
      - name: Check the theme is the only place colour lives
        run: npm run check:theme

      - name: Set web base path to the repo subpath
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('app.json'));p.expo.experiments=Object.assign({},p.expo.experiments,{baseUrl:'/${{ github.event.repository.name }}'});fs.writeFileSync('app.json',JSON.stringify(p,null,2));"

      - name: Generate voice clips (only if a TTS key is set)
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: node scripts/generate-voice.js

      # After generation, so a clip the API returned as silence is caught here
      # rather than by a learner. ~40s for all 2,893 with ffmpeg, which the
      # ubuntu runners ship.
      - name: Check that every voice clip is audible
        run: npm run check:voice

      - name: Export web bundle
        env:
          NODE_ENV: production
          # Optional: set these as repo Actions secrets to enable sign-in + cloud
          # save on the hosted preview. Left empty, the app runs in guest mode.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Set EXPO_PUBLIC_TESTER_MODE as a repo variable to put the tester
          # panel on the hosted preview. Left unset, the panel is not built at
          # all — see src/store/useTesterStore.ts for why that matters more than
          # the passphrase does.
          EXPO_PUBLIC_TESTER_MODE: ${{ vars.EXPO_PUBLIC_TESTER_MODE }}
          EXPO_PUBLIC_TESTER_USER: ${{ secrets.EXPO_PUBLIC_TESTER_USER }}
          EXPO_PUBLIC_TESTER_PASS: ${{ secrets.EXPO_PUBLIC_TESTER_PASS }}
        run: npx expo export --platform web --output-dir dist

      # Expo's export writes a <title> and nothing else, so without this the
      # hosted app has no description for a search engine and a link to it
      # pastes as a bare URL with no card. Runs after the export, and after the
      # base path is set, so the absolute URLs are right.
      - name: Add the description and share card to the web page
        env:
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run web:meta

      # Drives the built app in a real browser and answers questions, checking
      # that the question does not change under the answer. Needs the bundle, so
      # it runs after the export rather than with the other checks.
      - name: Check that answering a question does not replace it
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" \
            npm run check:stability

      # The scenery sits behind body text on every screen, and its own comment
      # has always promised 6:1 against the cream. Nothing measured it, and it
      # was not true — stacked cloud layers came to 4.47:1, under WCAG AA. This
      # reads the real pixels of the built app, so needs the export too.
      - name: Check the scenery stays behind the text
        run: |
          CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" \
            npm run check:scenery

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
