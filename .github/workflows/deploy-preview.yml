name: Deploy web preview

# Builds the Expo web bundle and publishes it to GitHub Pages on every push,
# so there's always a live, up-to-date URL to test Harf in a phone browser —
# no download required. URL: https://<owner>.github.io/Urdu/

on:
  push:
    branches:
      - claude/language-learning-android-app-yu2gzz
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel in-flight builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set web base path to the repo subpath
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('app.json'));p.expo.experiments=Object.assign({},p.expo.experiments,{baseUrl:'/${{ github.event.repository.name }}'});fs.writeFileSync('app.json',JSON.stringify(p,null,2));"

      - name: Export web bundle
        env:
          NODE_ENV: production
        run: npx expo export --platform web --output-dir dist

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
