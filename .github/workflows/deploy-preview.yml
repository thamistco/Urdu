name: Deploy web preview

# Builds the Expo web bundle and publishes it to GitHub Pages on every push,
# so there's always a live, up-to-date URL to test Harf in a phone browser —
# no download required. URL: https://<owner>.github.io/Urdu/

on:
  push:
    branches:
      - claude/language-learning-android-app-yu2gzz
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel in-flight builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These run before the build so a broken push fails loudly rather than
      # deploying. They are cheap — seconds — and cover the things a
      # typechecker cannot: content wiring, and how forgiving typed answers are.
      # Nothing may be pushed carrying a credential. This scans what git
      # actually tracks, for credential shapes rather than the word "key", and
      # self-tests against a canary so it cannot silently stop matching.
      - name: Check no credentials are committed
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      # Style is enforced, not requested. `react-hooks/exhaustive-deps` is an
      # error here rather than a warning: a stale dependency array is what made
      # every answer in a lesson get judged against the first question, so
      # grammar cost nothing to get wrong.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Folder layout and file names, from the engineering standard. It caught
      # `src/data/vocab/final.ts` on its first run — ten topics and several
      # hundred words behind a name that told a reader only that it came last.
      - name: Check the project structure
        run: npm run check:structure

      # Unit tests for the pure logic: the XP curve, the league ladder, the gem
      # payout and the streak arithmetic. The check:* scripts cover content and
      # rendering; this covers the functions.
      - name: Unit tests
        run: npm test

      - name: Audit content
        run: npm run audit

      - name: Check the typed-answer matcher
        run: npm run check:roman

      - name: Check Roman spellings agree with the canonical table
        run: npm run check:translit

      - name: Check the writing has no dashes in it
        run: npm run check:writing

      - name: Check that tracing is passable
        run: npm run check:trace

      - name: Check that every generated question is answerable
        run: npm run check:answerable

      - name: Check that words are taught before they are tested
        run: npm run check:order

      - name: Check that spaced repetition does what it claims
        run: npm run check:srs

      # The palette promises that re-theming is one file. Two things break that
      # silently and neither shows on screen: tailwind.config.js drifting from
      # colors.ts (it has, across two re-themes), and colour written as raw hex
      # inside a component.
      - name: Check the theme is the only place colour lives
        run: npm run check:theme

      - name: Generate voice clips (only if a TTS key is set)
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: node scripts/generate-voice.js

      # After generation, so a clip the API returned as silence is caught here
      # rather than by a learner. ~40s for all 2,893 with ffmpeg, which the
      # ubuntu runners ship.
      - name: Check that every voice clip is audible
        run: npm run check:voice

      # `npm run build:web` is the only way this project builds, here and on a
      # laptop. The subpath and the commit stamp arrive as environment
      # variables that app.config.js reads — nothing rewrites a tracked file
      # mid-job any more. That rewrite is what made CI builds differ from local
      # ones, which is what let a broken check reach the deploy four times.
      - name: Build the web bundle
        env:
          NODE_ENV: production
          HARF_BASE_URL: /${{ github.event.repository.name }}
          HARF_BUILD_SHA: ${{ github.sha }}
          # Optional: set these as repo Actions secrets to enable sign-in + cloud
          # save on the hosted preview. Left empty, the app runs in guest mode.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Set EXPO_PUBLIC_TESTER_MODE as a repo variable to put the tester
          # panel on the hosted preview. Left unset, the panel is not built at
          # all — see src/store/useTesterStore.ts for why that matters more than
          # the passphrase does.
          EXPO_PUBLIC_TESTER_MODE: ${{ vars.EXPO_PUBLIC_TESTER_MODE }}
          EXPO_PUBLIC_TESTER_USER: ${{ secrets.EXPO_PUBLIC_TESTER_USER }}
          EXPO_PUBLIC_TESTER_PASS: ${{ secrets.EXPO_PUBLIC_TESTER_PASS }}
        run: npm run build:web

      # Expo's export writes a <title> and nothing else, so without this the
      # hosted app has no description for a search engine and a link to it
      # pastes as a bare URL with no card. Runs after the export, and after the
      # base path is set, so the absolute URLs are right.
      - name: Add the description and share card to the web page
        env:
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          HARF_BASE_URL: /${{ github.event.repository.name }}
          HARF_BUILD_SHA: ${{ github.sha }}
        run: npm run web:meta

      # Drives the built app in a real browser and answers questions, checking
      # that the question does not change under the answer. Needs the bundle, so
      # it runs after the export rather than with the other checks.
      - name: Check that answering a question does not replace it
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" \
            npm run check:stability

      # The scenery sits behind body text on every screen, and its own comment
      # has always promised 6:1 against the cream. Nothing measured it, and it
      # was not true — stacked cloud layers came to 4.47:1, under WCAG AA. This
      # reads the real pixels of the built app, so needs the export too.
      #
      # `npm run check:all` runs this whole job locally, reading its steps from
      # this file, against a build made with the deploy's base path — which is
      # the difference that made this step pass locally and fail here twice.
      - name: Check the scenery stays behind the text
        run: |
          CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" \
            npm run check:scenery

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A green pipeline is not a deploy. This fetches the live URL and asserts
      # it is serving the commit that was just built, using the stamp
      # app.config.js put in the bundle. Without it, "success" here means the
      # upload returned 200 — which is not the same as the site having changed,
      # and twice it was reported as if it were.
      - uses: actions/checkout@v4
      - name: Verify the live site is serving this commit
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          HARF_BUILD_SHA: ${{ github.sha }}
        run: node scripts/check-deployed.js
